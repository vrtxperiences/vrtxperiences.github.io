<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VRTX Experiences | Experiencias sin límites</title>
<meta name="description" content="VRTX Experiences: experiencias de aventura, viajes extremos y paracaidismo. Vive experiencias sin límites.">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:Arial, Helvetica, sans-serif;
  background:#000;
  color:#fff;
}

.hero{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:30px;
  background:radial-gradient(circle at center,#06202d 0%,#000 65%);
}

.logo{
  max-width:520px;
  width:88%;
  animation:aparecer 1.8s ease, flotar 4s ease-in-out infinite;
  filter:drop-shadow(0 0 25px rgba(0,212,255,.8));
}

@keyframes aparecer{
  from{opacity:0;transform:scale(.85)}
  to{opacity:1;transform:scale(1)}
}

@keyframes flotar{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-12px)}
}

.slogan{
  margin-top:25px;
  font-size:22px;
  letter-spacing:4px;
  color:#00d4ff;
}

.scroll{
  margin-top:70px;
  font-size:36px;
  animation:bajar 1.5s infinite;
}

@keyframes bajar{
  0%,100%{transform:translateY(0);opacity:.4}
  50%{transform:translateY(12px);opacity:1}
}

.seccion{
  padding:80px 20px;
  text-align:center;
}

.seccion h2{
  font-size:36px;
  letter-spacing:4px;
  margin-bottom:30px;
}

.azul{color:#00d4ff}

.video{
  max-width:900px;
  margin:auto;
  border-radius:22px;
  overflow:hidden;
  box-shadow:0 0 35px rgba(0,212,255,.35);
}

.video iframe{
  width:100%;
  height:500px;
  border:0;
}

.redes{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
  gap:25px;
  max-width:900px;
  margin:40px auto 0;
}

.boton{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:14px;
  padding:25px;
  border:1px solid #00d4ff;
  border-radius:18px;
  text-decoration:none;
  color:white;
  background:rgba(255,255,255,.05);
  transition:.3s;
}

.boton:hover{
  transform:translateY(-8px);
  box-shadow:0 0 25px rgba(0,212,255,.5);
}

.boton img{
  width:55px;
  height:55px;
  filter:invert(1);
}

.boton span{
  font-weight:bold;
  letter-spacing:2px;
}

footer{
  padding:60px 20px;
  text-align:center;
  border-top:1px solid #00d4ff;
  color:#ccc;
}

footer a{
  color:#00d4ff;
  text-decoration:none;
}

@media(max-width:600px){
  .video iframe{height:250px}
  .seccion h2{font-size:26px}
  .slogan{font-size:15px}
}
</style>
</head>

<body>

<section class="hero">
  <img class="logo" src="logo.PNG" alt="VRTX Experiences">
  <p class="slogan">EXPERIENCIAS SIN LÍMITES</p>
  <div class="scroll">⌄</div>
</section>

<section class="seccion">
  <h2>SIENTE LA <span class="azul">ADRENALINA</span></h2>

  <div class="video">
    <iframe 
      src="https://www.youtube.com/embed/rxx_gelY9c4"
      title="Salto en paracaídas VRTX Experiences"
      allowfullscreen>
    </iframe>
  </div>
</section>

<section class="seccion">
  <h2>SÍGUENOS EN <span class="azul">NUESTRAS REDES</span></h2>

  <div class="redes">
    <a class="boton" href="https://facebook.com/" target="_blank">
      <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/facebook.svg" alt="Facebook">
      <span>FACEBOOK</span>
    </a>

    <a class="boton" href="https://instagram.com/" target="_blank">
      <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/instagram.svg" alt="Instagram">
      <span>INSTAGRAM</span>
    </a>

    <a class="boton" href="https://tiktok.com/" target="_blank">
      <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/tiktok.svg" alt="TikTok">
      <span>TIKTOK</span>
    </a>

    <a class="boton" href="https://wa.me/525586892207" target="_blank">
      <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/whatsapp.svg" alt="WhatsApp">
      <span>WHATSAPP</span>
    </a>
  </div>
</section>

<footer>
  <p>Contacto</p>
  <p><a href="mailto:contacto@vrtxexperiences.com">contacto@vrtxexperiences.com</a></p>
  <br>
  <p>© 2026 VRTX Experiences. Todos los derechos reservados.</p>
</footer>

</body>
</html>
