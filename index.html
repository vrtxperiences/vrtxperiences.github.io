<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VRTX Experiences | Experiencias sin límites</title>

<meta name="description" content="Paracaidismo, aventura y experiencias inolvidables. Vive experiencias sin límites con VRTX Experiences.">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{
font-family:Arial, Helvetica, sans-serif;
background:#000;
color:white;
overflow-x:hidden;
}

.hero{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
background:
radial-gradient(circle at center,
#062433 0%,
#000 70%);
}

.logo{
width:90%;
max-width:900px;
animation:fadeIn 1.5s ease,
floatLogo 5s ease-in-out infinite;
filter:drop-shadow(0 0 30px rgba(0,212,255,.7));
}

@keyframes fadeIn{
from{
opacity:0;
transform:scale(.8);
}
to{
opacity:1;
transform:scale(1);
}
}

@keyframes floatLogo{
0%,100%{
transform:translateY(0px);
}
50%{
transform:translateY(-10px);
}
}

.slogan{
margin-top:20px;
font-size:20px;
letter-spacing:4px;
color:#00d4ff;
}

.scroll{
margin-top:50px;
font-size:40px;
animation:bounce 1.5s infinite;
}

@keyframes bounce{
0%,100%{
transform:translateY(0);
opacity:.4;
}
50%{
transform:translateY(10px);
opacity:1;
}
}

section{
padding:80px 20px;
text-align:center;
}

h2{
font-size:32px;
margin-bottom:30px;
letter-spacing:3px;
}

.highlight{
color:#00d4ff;
}

.video-container{
max-width:1000px;
margin:auto;
border-radius:20px;
overflow:hidden;
box-shadow:0 0 30px rgba(0,212,255,.35);
}

.video-container iframe{
width:100%;
height:560px;
border:none;
}

.redes{
max-width:1000px;
margin:auto;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:25px;
}

.social-btn{
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
padding:25px;
text-decoration:none;
color:white;
border:2px solid #00d4ff;
border-radius:20px;
background:rgba(255,255,255,.05);
transition:.3s;
}

.social-btn:hover{
transform:translateY(-8px);
box-shadow:0 0 25px rgba(0,212,255,.5);
}

.social-btn img{
width:70px;
height:70px;
margin-bottom:15px;
}

.social-btn span{
font-weight:bold;
letter-spacing:2px;
}

footer{
padding:60px 20px;
border-top:1px solid #00d4ff;
text-align:center;
color:#ccc;
}

footer a{
color:#00d4ff;
text-decoration:none;
}

@media(max-width:768px){

.video-container iframe{
height:250px;
}

.logo{
max-width:600px;
}

h2{
font-size:26px;
}

.slogan{
font-size:15px;
}

}

</style>
</head>

</iframe>

</div>

</section>

<section>

SÍGUENOS EN <span class="highlight">NUESTRAS REDES</span>
</h2>

<a class="social-btn"
href="https://www.instagram.com/vrtxexperiences/"
target="_blank">

<span>INSTAGRAM</span>

<span>WHATSAPP</span>
