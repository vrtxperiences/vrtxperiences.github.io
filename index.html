<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VRTX Experiences | Experiencias sin límites</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:Arial, Helvetica, sans-serif;
  background:#000;
  color:white;
}

.hero{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:25px;
  background:radial-gradient(circle,#062333 0%,#000 70%);
}

.logo{
  width:95%;
  max-width:850px;
  object-fit:contain;
  animation:aparecer 1.8s ease, flotar 4s ease-in-out infinite;
  filter:drop-shadow(0 0 35px rgba(0,212,255,.8));
}

@keyframes aparecer{
  from{opacity:0;transform:scale(.85)}
  to{opacity:1;transform:scale(1)}
}

@keyframes flotar{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-12px)}
}

.slogan{
  margin-top:25px;
  font-size:22px;
  letter-spacing:6px;
  color:#00d4ff;
}

.scroll{
  margin-top:70px;
  font-size:42px;
  animation:bajar 1.5s infinite;
}

@keyframes bajar{
  0%,100%{transform:translateY(0);opacity:.4}
  50%{transform:translateY(12px);opacity:1}
}

.seccion{
  padding:80px 20px;
  text-align:center;
}

.seccion h2{
  font-size:34px;
  letter-spacing:4px;
  margin-bottom:35px;
}

.azul{color:#00d4ff}

.video{
  max-width:900px;
  margin:auto;
  border-radius:22px;
  overflow:hidden;
  box-shadow:0 0 35px rgba(0,212,255,.35);
}

.video iframe{
  width:100%;
  height:500px;
  border:0;
}

.redes{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
  gap:25px;
  max-width:950px;
  margin:40px auto 0;
}

.boton{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:15px;
  padding:28px;
  border:2px solid #00d4ff;
  border-radius:22px;
  text-decoration:none;
  color:white;
  background:rgba(255,255,255,.06);
  transition:.3s;
  min-height:170px;
}

.boton:hover{
  transform:translateY(-8px);
  box-shadow:0 0 30px rgba(0,212,255,.6);
}

.icono{
  width:60px;
  height:60px;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:36px;
  font-weight:bold;
}

.facebook{background:#1877F2}
.instagram{background:linear-gradient(45deg,#f58529,#dd2a7b,#8134af,#515bd4)}
.tiktok{background:#000;border:2px solid #25F4EE;color:#fff}
.whatsapp{background:#25D366}

.boton span{
  font-weight:bold;
  letter-spacing:3px;
  font-size:18px;
}

footer{
  padding:60px 20px;
  text-align:center;
  border-top:1px solid #00d4ff;
  color:#ccc;
}

footer a{
  color:#00d4ff;
  text-decoration:none;
}

@media(max-width:600px){
  .logo{
    width:100%;
    max-width:600px;
  }

  .slogan{
    font-size:16px;
    letter-spacing:5px;
  }

  .video iframe{
    height:250px;
  }

  .seccion h2{
    font-size:26px;
  }

  .redes{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<section class="hero">
  <img class="logo" src="./logo.PNG" alt="VRTX Experiences">
  <p class="slogan">EXPERIENCIAS SIN LÍMITES</p>
  <div class="scroll">⌄</div>
</section>

<section class="seccion">
  <h2>SIENTE LA <span class="azul">ADRENALINA</span></h2>

  <div class="video">
    <iframe 
      src="https://www.youtube.com/embed/rxx_gelY9c4"
      title="Salto en paracaídas VRTX Experiences"
      allowfullscreen>
    </iframe>
  </div>
</section>

<section class="seccion">
  <h2>SÍGUENOS EN <span class="azul">NUESTRAS REDES</span></h2>

  <div class="redes">

    <a class="boton" href="https://facebook.com/" target="_blank">
      <div class="icono facebook">f</div>
      <span>FACEBOOK</span>
    </a>

    <a class="boton" href="https://instagram.com/" target="_blank">
      <div class="icono instagram">◎</div>
      <span>INSTAGRAM</span>
    </a>

    <a class="boton" href="https://tiktok.com/" target="_blank">
      <div class="icono tiktok">♪</div>
      <span>TIKTOK</span>
    </a>

    <a class="boton" href="https://wa.me/525586892207" target="_blank">
      <div class="icono whatsapp">☎</div>
      <span>WHATSAPP</span>
    </a>

  </div>
</section>

<footer>
  <p>Contacto</p>
  <p><a href="mailto:contacto@vrtxexperiences.com">contacto@vrtxexperiences.com</a></p>
  <br>
  <p>© 2026 VRTX Experiences. Todos los derechos reservados.</p>
</footer>

</body>
</html>
